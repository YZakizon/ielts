name: ielts

services:
  postgres:
    image: postgres:16-alpine
    container_name: ielts-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ielts}
      POSTGRES_USER: ${POSTGRES_USER:-ielts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ielts_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ielts-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  ielts:
    build:
      context: .
    image: ielts:td340
    container_name: ielts
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:${IELTS_HOST_PORT:-8091}:8080"
    environment:
      PORT: 8080
      METRICS_FILE: /data/metrics.json
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD:-ielts_password}@postgres:5432/${POSTGRES_DB:-ielts}}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_DURATION_MS: ${SESSION_DURATION_MS:-43200000}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_LOCKOUT_MS: ${LOGIN_RATE_LIMIT_LOCKOUT_MS:-900000}
    volumes:
      - ielts-metrics:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ielts-metrics:
  ielts-postgres:
