<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | IELTS Study Hub</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="IELTS Study Hub home">
        <span class="brand-mark">I</span>
        <span>IELTS Study Hub</span>
      </a>
      <nav class="site-nav" aria-label="Admin navigation">
        <a class="nav-link" href="/">Home</a>
      </nav>
    </header>

    <main class="app-shell admin-shell">
      <section class="admin-hero" aria-label="Admin users">
        <div>
          <p class="eyebrow">Admin</p>
          <h1>Users and billing</h1>
        </div>
        <p id="adminStatus" class="admin-status" aria-live="polite">Loading users...</p>
      </section>

      <section class="panel admin-panel" aria-label="User billing table">
        <div class="admin-table-header">
          <span>User</span>
          <span>Plan</span>
          <span>Current usage</span>
          <span>Status</span>
          <span>Joined</span>
          <span aria-label="Actions"></span>
        </div>
        <div id="adminUsersList" class="admin-users-list"></div>
      </section>
    </main>

    <dialog id="adminConfirmDialog" class="confirm-dialog" aria-labelledby="adminConfirmTitle">
      <form method="dialog">
        <div class="confirm-dialog-header"><h2 id="adminConfirmTitle">Confirm action</h2><button class="icon-button" type="submit" value="cancel" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button></div>
        <p id="adminConfirmMessage"></p>
        <div class="confirm-dialog-actions"><button class="secondary-button" type="submit" value="cancel">Cancel</button><button id="adminConfirmSubmit" type="submit" value="confirm">Confirm</button></div>
      </form>
    </dialog>

    <dialog id="adminSubscriptionDialog" class="confirm-dialog admin-subscription-dialog" aria-labelledby="adminSubscriptionTitle">
      <form method="dialog">
        <div class="confirm-dialog-header"><h2 id="adminSubscriptionTitle">Grant subscription</h2><button class="icon-button" type="button" data-admin-subscription-cancel aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button></div>
        <label>
          Reason
          <input id="adminSubscriptionReason" type="text" autocomplete="off" required />
        </label>
        <label>
          Expires
          <select id="adminSubscriptionExpiryPreset">
            <option value="unlimited">Unlimited</option>
            <option value="1-month">1 month</option>
            <option value="3-months">3 months</option>
            <option value="6-months">6 months</option>
            <option value="1-year">1 year</option>
            <option value="custom">Custom date</option>
          </select>
        </label>
        <label id="adminSubscriptionCustomExpiryField" class="hidden">
          Custom expiration date
          <input id="adminSubscriptionCustomExpiry" type="date" />
        </label>
        <div class="confirm-dialog-actions"><button class="secondary-button" type="button" data-admin-subscription-cancel>Cancel</button><button type="submit" value="confirm">Apply</button></div>
      </form>
    </dialog>

    <script src="/admin.js"></script>
  </body>
</html>
