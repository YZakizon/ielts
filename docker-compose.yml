name: ielts

services:
  postgres:
    image: postgres:16-alpine
    container_name: ielts-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ielts}
      POSTGRES_USER: ${POSTGRES_USER:-ielts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ielts_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ielts-postgres:/var/lib/postgresql/data
    networks:
      - ielts-internal
    restart: unless-stopped

  ielts:
    build:
      context: .
    image: ielts:local
    container_name: ielts
    env_file:
      - path: .env
        required: false
    ports:
      - "${IELTS_HOST_PORT:-8081}:8080"
    environment:
      PORT: 8080
      METRICS_FILE: /data/metrics.json
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD:-ielts_password}@postgres:5432/${POSTGRES_DB:-ielts}}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-capis2256@gmail.com,yeffry@appliva.io}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SESSION_DURATION_MS: ${SESSION_DURATION_MS:-43200000}
      LOGIN_RATE_LIMIT_WINDOW_MS: ${LOGIN_RATE_LIMIT_WINDOW_MS:-900000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      LOGIN_RATE_LIMIT_LOCKOUT_MS: ${LOGIN_RATE_LIMIT_LOCKOUT_MS:-900000}
      SIGNUP_RATE_LIMIT_WINDOW_MS: ${SIGNUP_RATE_LIMIT_WINDOW_MS:-900000}
      SIGNUP_RATE_LIMIT_IP_MAX: ${SIGNUP_RATE_LIMIT_IP_MAX:-10}
      SIGNUP_RATE_LIMIT_EMAIL_MAX: ${SIGNUP_RATE_LIMIT_EMAIL_MAX:-3}
      SIGNUP_RATE_LIMIT_LOCKOUT_MS: ${SIGNUP_RATE_LIMIT_LOCKOUT_MS:-900000}
      FREE_SESSION_LIMIT: ${FREE_SESSION_LIMIT:-5}
      FREE_VOCAB_GENERATION_LIMIT: ${FREE_VOCAB_GENERATION_LIMIT:-2}
      FREE_ACCOUNT_LIMIT_PER_MINUTE: ${FREE_ACCOUNT_LIMIT_PER_MINUTE:-2}
      FREE_ACCOUNT_LIMIT_PER_HOUR: ${FREE_ACCOUNT_LIMIT_PER_HOUR:-20}
      FREE_ACCOUNT_LIMIT_PER_DAY: ${FREE_ACCOUNT_LIMIT_PER_DAY:-50}
    volumes:
      - ielts-metrics:/data
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.environment=dev"
      - "traefik.http.routers.ielts.rule=Host(`ielts.localhost`)"
      - "traefik.http.routers.ielts.entrypoints=web"
      - "traefik.http.services.ielts.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-proxy"
    networks:
      - ielts-internal
      - traefik-proxy
    restart: unless-stopped

networks:
  ielts-internal:
    driver: bridge
  traefik-proxy:
    external: true

volumes:
  ielts-metrics:
  ielts-postgres:
