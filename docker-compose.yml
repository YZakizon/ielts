name: ielts

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-ielts}
  POSTGRES_USER: ${POSTGRES_USER:-ielts}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ielts_password}

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 5s
  timeout: 5s
  retries: 10

x-postgres-command: &postgres-command
  - postgres
  - -c
  - log_error_verbosity=verbose
  - -c
  - log_connections=on
  - -c
  - log_disconnections=on
  - -c
  - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_STATEMENT:-1000}
  - -c
  - log_statement=${POSTGRES_LOG_STATEMENT:-none}

x-app-env: &app-env
  PORT: 8080
  METRICS_FILE: /data/metrics.json

services:
  postgres-dev:
    profiles: ["dev"]
    image: postgres:16-alpine
    container_name: ielts-dev-postgres
    command: *postgres-command
    environment: *postgres-env
    healthcheck: *postgres-healthcheck
    volumes:
      - ielts-dev-postgres:/var/lib/postgresql/data
    networks:
      ielts-dev-internal:
        aliases:
          - postgres
    restart: unless-stopped

  ielts-dev:
    profiles: ["dev"]
    build:
      context: .
    image: ielts:local
    container_name: ielts-dev
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      DATABASE_HOST: postgres-dev
      DATABASE_NAME: ${POSTGRES_DB:-ielts}
      DATABASE_USER: ${POSTGRES_USER:-ielts}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ielts_password}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-capis2256@gmail.com,yeffry@appliva.io}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - ielts-dev-metrics:/data
    depends_on:
      postgres-dev:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.environment=dev"
      - "traefik.http.routers.ielts.rule=Host(`ielts.localhost`)"
      - "traefik.http.routers.ielts.entrypoints=web"
      - "traefik.http.services.ielts.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-proxy"
    networks:
      - ielts-dev-internal
      - traefik-proxy
    restart: unless-stopped

  postgres:
    profiles: ["td340"]
    image: postgres:16-alpine
    container_name: ielts-postgres
    command: *postgres-command
    environment: *postgres-env
    healthcheck: *postgres-healthcheck
    volumes:
      - ielts-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  ielts:
    profiles: ["td340"]
    build:
      context: .
    image: ielts:td340
    container_name: ielts
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:${IELTS_HOST_PORT:-8091}:8080"
    environment: *app-env
    volumes:
      - ielts-metrics:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  ielts-dev-internal:
    driver: bridge
  traefik-proxy:
    external: true

volumes:
  ielts-dev-metrics:
  ielts-dev-postgres:
  ielts-metrics:
  ielts-postgres:
